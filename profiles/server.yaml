# Server Profile - Production Server
# Optimized for production workloads with Docker and monitoring

hostname: ubuntu-server
locale: en_US.UTF-8
keyboard:
  layout: us
timezone: UTC

storage:
  layout:
    name: lvm

users:
  - username: admin
    password: "$6$rounds=4096$randomsalt$hashedpassword"
    ssh_authorized_keys: []
    groups:
      - sudo
      - users
      - docker

packages:
  # Essential tools
  - curl
  - wget
  - git
  - vim
  - htop
  - net-tools
  - openssh-server
  - tmux
  - jq
  - unzip
  
  # Docker and container tools
  - docker.io
  - docker-compose
  
  # Monitoring and diagnostics
  - sysstat
  - iotop
  - iftop
  - nmap
  - tcpdump
  
  # Development tools
  - build-essential
  - python3
  - python3-pip

post_install_scripts:
  - setup-ssh.sh
  - setup-docker.sh
  - setup-users.sh

security:
  disable_root: true
  password_authentication: false
  ufw_enabled: true
  ufw_rules:
    - port: 22
      proto: tcp
      action: allow
    - port: 80
      proto: tcp
      action: allow
    - port: 443
      proto: tcp
      action: allow

kernel_parameters:
  - net.core.somaxconn=65535
  - net.ipv4.tcp_max_syn_backlog=65535

sysctl:
  - vm.swappiness=10
  - net.core.netdev_max_backlog=5000
